<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合約範例 - 電子簽名</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Noto Serif TC", "Times New Roman", "SimSun", serif;
      background: #e5e7eb;
      min-height: 100vh;
      padding: 30px 20px 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── 合約頁面 ──────────────────────── */
    .contract {
      background: #fff;
      width: 100%;
      max-width: 800px;
      padding: 60px 60px 40px;
      box-shadow: 0 2px 16px rgba(0,0,0,.1);
      border: 1px solid #d1d5db;
      line-height: 2;
      color: #1f2937;
      position: relative;
    }

    .contract-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .contract-header h1 {
      font-size: 26px;
      letter-spacing: 6px;
      margin-bottom: 6px;
    }

    .contract-header .contract-no {
      font-size: 13px;
      color: #6b7280;
      font-family: monospace;
    }

    .contract-body h2 {
      font-size: 16px;
      margin: 24px 0 8px;
      border-left: 4px solid #2563eb;
      padding-left: 10px;
    }

    .contract-body p {
      font-size: 15px;
      text-indent: 2em;
      margin-bottom: 8px;
    }

    .contract-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0 20px;
      font-size: 14px;
    }

    .contract-body th,
    .contract-body td {
      border: 1px solid #d1d5db;
      padding: 8px 12px;
      text-align: left;
    }

    .contract-body th {
      background: #f9fafb;
      font-weight: 600;
      width: 120px;
    }

    .contract-body .field {
      display: inline-block;
      width: 180px;
      border-bottom: 1px solid #374151;
      padding: 0 4px;
      text-align: center;
    }

    /* ── 簽名列 ────────────────────────── */
    .signature-row {
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }

    .signature-block {
      text-align: center;
      min-width: 220px;
    }

    .signature-block .label {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .signature-area {
      border: 2px dashed #d1d5db;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 120px;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      overflow: hidden;
      background: #fefefe;
    }

    .signature-area:hover {
      border-color: #3b82f6;
      background: #f0f7ff;
    }

    .signature-area .placeholder {
      color: #9ca3af;
      font-size: 13px;
      font-family: sans-serif;
    }

    .signature-area .placeholder svg {
      display: block;
      margin: 0 auto 4px;
    }

    .signature-area img {
      max-width: 100%;
      max-height: 100px;
    }

    .signature-area .clear-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 14px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .signature-area.has-signature .clear-btn { display: flex; }
    .signature-area.has-signature .placeholder { display: none; }

    .signature-date {
      font-size: 13px;
      color: #6b7280;
      margin-top: 8px;
      font-family: sans-serif;
    }

    /* ── 底部操作列 ────────────────────── */
    .action-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      padding: 14px 24px;
      display: flex;
      justify-content: center;
      gap: 16px;
      z-index: 9999;
      box-shadow: 0 -2px 12px rgba(0,0,0,.06);
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      color: #374151;
      font-size: 14px;
      font-family: sans-serif;
      cursor: pointer;
      transition: all .15s ease;
      user-select: none;
    }

    .action-btn:hover { background: #f9fafb; border-color: #9ca3af; }
    .action-btn svg { flex-shrink: 0; }
    .action-btn * { pointer-events: none; }

    .action-btn.primary {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }
    .action-btn.primary:hover { background: #1d4ed8; }

    .action-btn.success {
      background: #16a34a;
      color: #fff;
      border-color: #16a34a;
    }
    .action-btn.success:hover { background: #15803d; }

    .action-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* ── Toast ─────────────────────────── */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #1f2937;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-family: sans-serif;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100000;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 600px) {
      .contract { padding: 30px 24px 24px; }
      .signature-row { justify-content: center; }
      .action-bar { gap: 8px; padding: 10px 12px; }
      .action-btn { padding: 8px 14px; font-size: 13px; }
    }

    /* 截圖時隱藏操作列 */
    body.capturing .action-bar { display: none !important; }
    body.capturing .toast { display: none !important; }
    body.capturing { padding-bottom: 30px; }
  </style>
</head>
<body>

  <!-- ── 合約內容 ──────────────────────────── -->
  <div class="contract" id="contractPage">
    <div class="contract-header">
      <h1>範 例 合 約 </h1>
      <div class="contract-no">合約編號：CTR-2026-04170001</div>
    </div>

    <div class="contract-body">
      <h2>第一條　合約雙方</h2>
      <p>
        甲方（委託方）公司名稱：<span class="field">AAA股份有限公司</span>，
        
        代表人：<span class="field">王大明</span>。
      </p>
      <p>
        乙方（受託方）公司名稱：<span class="field">BBB資訊有限公司</span>，

        代表人：<span class="field">李雅芳</span>。
      </p>

      <h2>第二條　服務內容</h2>
      <p>XXXXXXXXXXXXXXX</p>
  </div>

    <!-- ── 簽名區（右下角）─────────────────── -->
    <div class="signature-row">
      <div class="signature-block">
        <div class="label">乙方代表簽章</div>
        <div class="signature-area" id="signatureArea">
          <div class="placeholder">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
            點擊此處簽名
          </div>
          <img id="signaturePreview" src="" alt="簽名預覽" style="display:none">
          <button class="clear-btn" id="clearSignature" title="清除簽名">&times;</button>
        </div>
        <div class="signature-date" id="signatureDate"></div>
      </div>
    </div>
  </div>

  <!-- ── 底部操作列 ────────────────────────── -->
  <div class="action-bar">
    <button class="action-btn" id="btnSaveJpg">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      另存 JPG 圖片
    </button>
    <button class="action-btn primary" id="btnSavePdf">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      輸出 PDF
    </button>
  </div>

  <div class="toast" id="toast"></div>

  <!-- ── 第三方函式庫（截圖 & PDF）──────────── -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>

  <!-- ── 簽名板元件 ────────────────────────── -->
  <script src="signature-pad.js"></script>

  <script>
    (function () {
      var signatureDataUrl = null;
      var signatureArea = document.getElementById('signatureArea');
      var signaturePreview = document.getElementById('signaturePreview');
      var clearBtn = document.getElementById('clearSignature');
      var signatureDate = document.getElementById('signatureDate');

      // ── 簽名板 ──────────────────────────
      var pad = new SignaturePad({
        title: '請在此處簽名',
        confirmText: '完成簽名',
        cancelText: '取消',
        clearText: '清除畫布',
        undoText: '復原',
        onComplete: function (dataUrl) {
          signatureDataUrl = dataUrl;
          signaturePreview.src = dataUrl;
          signaturePreview.style.display = 'block';
          signatureArea.classList.add('has-signature');
          signatureDate.textContent = '簽署日期：' + formatDate(new Date());
          showToast('✅ 簽名已儲存');
        },
        onCancel: function () {
          showToast('已取消簽名');
        }
      });

      signatureArea.addEventListener('click', function (e) {
        if (e.target === clearBtn || e.target.closest('.clear-btn')) return;
        pad.open();
      });

      clearBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        signatureDataUrl = null;
        signaturePreview.src = '';
        signaturePreview.style.display = 'none';
        signatureArea.classList.remove('has-signature');
        signatureDate.textContent = '';
        showToast('簽名已清除');
      });

      // ── 截圖另存 JPG ────────────────────
      document.getElementById('btnSaveJpg').addEventListener('click', function () {
        var btn = this;
        btn.disabled = true;
        showToast('正在產生圖片…');

        document.body.classList.add('capturing');

        html2canvas(document.getElementById('contractPage'), {
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff'
        }).then(function (canvas) {
          document.body.classList.remove('capturing');
          var link = document.createElement('a');
          link.download = '合約範例_' + formatDateFile(new Date()) + '.jpg';
          link.href = canvas.toDataURL('image/jpeg', 0.95);
          link.click();
          btn.disabled = false;
          showToast('✅ JPG 圖片已下載');
        }).catch(function (err) {
          document.body.classList.remove('capturing');
          btn.disabled = false;
          console.error(err);
          showToast('❌ 截圖失敗');
        });
      });

      // ── 輸出 PDF ───────────────────────
      document.getElementById('btnSavePdf').addEventListener('click', function () {
        var btn = this;
        btn.disabled = true;
        showToast('正在產生 PDF…');

        document.body.classList.add('capturing');

        html2canvas(document.getElementById('contractPage'), {
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff'
        }).then(function (canvas) {
          document.body.classList.remove('capturing');

          var imgData = canvas.toDataURL('image/jpeg', 0.95);
          var imgWidth = canvas.width;
          var imgHeight = canvas.height;

          // A4: 210 x 297 mm
          var pdf = new jspdf.jsPDF({
            orientation: imgWidth > imgHeight ? 'l' : 'p',
            unit: 'mm',
            format: 'a4'
          });

          var pageWidth = pdf.internal.pageSize.getWidth();
          var pageHeight = pdf.internal.pageSize.getHeight();
          var margin = 10;
          var contentWidth = pageWidth - margin * 2;
          var contentHeight = (imgHeight / imgWidth) * contentWidth;

          // 多頁處理
          if (contentHeight <= pageHeight - margin * 2) {
            pdf.addImage(imgData, 'JPEG', margin, margin, contentWidth, contentHeight);
          } else {
            var remainHeight = imgHeight;
            var position = 0;
            var sliceHeight = ((pageHeight - margin * 2) / contentWidth) * imgWidth;

            while (remainHeight > 0) {
              var sliceCanvas = document.createElement('canvas');
              sliceCanvas.width = imgWidth;
              var currentSlice = Math.min(sliceHeight, remainHeight);
              sliceCanvas.height = currentSlice;
              var sliceCtx = sliceCanvas.getContext('2d');
              sliceCtx.drawImage(canvas, 0, position, imgWidth, currentSlice, 0, 0, imgWidth, currentSlice);

              var sliceData = sliceCanvas.toDataURL('image/jpeg', 0.95);
              var sliceRenderHeight = (currentSlice / imgWidth) * contentWidth;
              pdf.addImage(sliceData, 'JPEG', margin, margin, contentWidth, sliceRenderHeight);

              remainHeight -= currentSlice;
              position += currentSlice;
              if (remainHeight > 0) pdf.addPage();
            }
          }

          pdf.save('合約範例_' + formatDateFile(new Date()) + '.pdf');
          btn.disabled = false;
          showToast('✅ PDF 已下載');
        }).catch(function (err) {
          document.body.classList.remove('capturing');
          btn.disabled = false;
          console.error(err);
          showToast('❌ PDF 產生失敗');
        });
      });

      // ── 工具函式 ────────────────────────
      function formatDate(d) {
        return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
      }

      function formatDateFile(d) {
        return d.getFullYear() + '' +
          String(d.getMonth() + 1).padStart(2, '0') +
          String(d.getDate()).padStart(2, '0');
      }

      function showToast(msg) {
        var toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(function () { toast.classList.remove('show'); }, 2500);
      }
    })();
  </script>

</body>
</html>
